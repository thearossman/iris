# This configuration is an example to show Iris in "offline" mode, which
# reads from a PCAP file.

main_core = 0
nb_memory_channels = 6

[mempool]
    capacity = 262_144
    cache_size = 512

[offline]
    pcap = "./traces/small_flows.pcap"
    mtu = 9702

[conntrack]
    max_connections = 10_000_000
    # Out-of-order segments buffered per direction. On overflow Iris gives up on the
    # oldest sequence gap and resumes after it; the connection is retained.
    max_out_of_order = 500
    timeout_resolution = 100
    udp_inactivity_timeout = 60_000
    tcp_inactivity_timeout = 300_000
    # How long to wait for a sequence gap to be filled before giving up on it. On
    # expiry the buffered post-gap data is delivered and the connection continues
    # under tcp_inactivity_timeout. Defaults to tcp_inactivity_timeout.
    tcp_reassembly_timeout = 10_000
    tcp_establish_timeout = 5000
    # Track TCP connections if first packet seen is not a bare SYN.
    # init_synack = false
    # init_data = false
    # init_fin = false
    # init_rst = false