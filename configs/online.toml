main_core = 0
nb_memory_channels = 6

[mempool]
capacity = 8_388_608
cache_size = 512

[online]
duration = 120
nb_rxd = 32768
promiscuous = true
mtu = 1500
hardware_assist = true
[[online.ports]]
device = "0000:3b:00.0"
cores = [ 1, 2, 3, 4, 5, 6, 7, 8 ]

[online.ports.sink]
core = 17
nb_buckets = 512

[[online.ports]]
device = "0000:d8:00.0"
cores = [ 9, 10, 11, 12, 13, 14, 15, 16 ]

[online.ports.sink]
core = 18
nb_buckets = 512

[conntrack]
max_connections = 10000000
# Out-of-order segments buffered per direction. On overflow Iris gives up on the
# oldest sequence gap and resumes after it; the connection is retained.
max_out_of_order = 500
timeout_resolution = 100
udp_inactivity_timeout = 60000
tcp_inactivity_timeout = 300000
# How long to wait for a sequence gap to be filled before giving up on it. On
# expiry the buffered post-gap data is delivered and the connection continues
# under tcp_inactivity_timeout.
tcp_reassembly_timeout = 10000
tcp_establish_timeout = 5000

[online.prometheus]
port = 9898

[online.monitor.display]
throughput = true
mempool_usage = true
port_stats = [ "rx_good_packets", "rx_good_bytes", "rx_phy_packets", "rx_phy_bytes", "rx_mbuf_allocation_errors", "rx_phy_discard_packets", "rx_missed_errors",]